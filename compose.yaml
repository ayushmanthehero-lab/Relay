name: agentmemory
services:
  falkordb:
    image: falkordb/falkordb@sha256:107455e862a824e45e8e9f5a7fbfdf5e00a08b14e13eae2577c72fd9e3f59ba6
    ports:
      - "127.0.0.1:6381:6379"
      - "127.0.0.1:3002:3000"
    volumes:
      - relay_graph_data:/data
    environment:
      REDIS_ARGS: "--dir /data --appendonly yes --appendfsync everysec --save 60 1"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: 6379
      MODEL_PROVIDER: ${MODEL_PROVIDER:-demo}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_TIMEOUT: ${MODEL_TIMEOUT:-90}
      DEMO_MODE: ${DEMO_MODE:-true}
      APP_SECRET: ${APP_SECRET:-local-agentmemory-demo-only}
      AUTH_TOKENS_JSON: ${AUTH_TOKENS_JSON:-{}}
      SUPPORT_MAX_ATTEMPTS: ${SUPPORT_MAX_ATTEMPTS:-3}
      SUPPORT_WORKER_ENABLED: ${SUPPORT_WORKER_ENABLED:-true}
      SUPPORT_WORKER_CONCURRENCY: ${SUPPORT_WORKER_CONCURRENCY:-3}
      SUPPORT_WORKER_INTERVAL: ${SUPPORT_WORKER_INTERVAL:-2}
      GRAPHITI_MAX_ATTEMPTS: ${GRAPHITI_MAX_ATTEMPTS:-3}
      GRAPHITI_ENABLED: ${GRAPHITI_ENABLED:-true}
      GRAPHITI_MAX_COROUTINES: ${GRAPHITI_MAX_COROUTINES:-2}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      EMBEDDING_LOCAL_PATH: ${EMBEDDING_LOCAL_PATH:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
    volumes:
      - ./data/embedding-models:/app/data/embedding-models
    depends_on:
      falkordb:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
volumes:
  relay_graph_data:
